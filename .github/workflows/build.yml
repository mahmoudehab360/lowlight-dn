name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: lowlight-dn-windows
          path: target/release/lowlight-dn.exe
