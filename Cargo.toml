[package]
name = "lowlight-dn"
version = "0.1.0"
edition = "2021"
description = "GPU low-light video denoiser (noise profile + motion-compensated temporal + wavelet spatial)"

[dependencies]
wgpu = "=22.1.0"
pollster = "0.3"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
